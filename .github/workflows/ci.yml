name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life on 2026-04-30 and jsdom 30 already
        # refuses to install on it (engines: ^22.22.2 || ^24.15.0 || >=26).
        # The library itself has no runtime dependencies and runs fine on 20 -
        # it is the test harness that needs 22. Pinning jsdom back so an
        # unsupported runtime can stay in the matrix would be testing the
        # wrong thing.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm test
      # Redundant on paper - `prepare` already ran tsc during install - but kept
      # explicit so a type error is its own failed step instead of hiding inside
      # the install output.
      - run: npm run types

      # The README states a minified size in two places. Both were true when
      # they were written and both went quietly false the moment a module was
      # added. A number typed into prose is a measurement with no instrument
      # behind it; this is the instrument.
      - run: npm run size
